<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="dash.css">
<style>
.badge{display:inline-block;padding:3px 12px;border-radius:20px;color:#fff;font-weight:700;font-size:.85rem}
.pass{background:var(--green)}.fail{background:var(--red)}
.qcard{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 0;border-bottom:1px solid #eceef0}
.qcard:last-child{border:0}.qcard small{color:#666;display:block}
.hello{background:linear-gradient(135deg,var(--primary),#a3213f);color:#fff;border-radius:16px;padding:22px;margin-bottom:22px}
.hello h1{color:#fff;margin:0}.hello p{margin:4px 0 0;opacity:.92}
.note{padding:12px 0;border-bottom:1px solid #eceef0}.note.new{font-weight:700}
.dot{background:var(--red);color:#fff;border-radius:20px;padding:1px 8px;font-size:.75rem;margin-left:6px}
</style></head>
<body>
<div id="topbar"><span class="sname">My School</span><button id="menu" aria-label="Menu">☰</button></div>
<aside id="sidebar">
  <div class="brand"><div class="logo-fallback" id="logoBox">📚</div><span class="sname">My School</span></div>
  <nav>
    <button data-tab="home" class="on">My Quizzes</button><button data-tab="results">Results</button>
    <button data-tab="progress">Performance</button><button data-tab="notes">Notifications<span class="dot" id="dot" hidden></span></button>
    <button id="out">Logout</button>
  </nav>
  <div class="who" id="who"></div>
</aside>
<div class="content dash">
  <section class="tab on" id="tab-home">
    <div class="hello"><h1 id="hi">Hello!</h1><p id="info"></p></div>
    <div class="cards" id="kpis"></div>
    <div class="panel"><b>Available now</b><div id="avail"></div></div>
    <div class="panel"><b>Upcoming</b><div id="upc"></div></div>
  </section>
  <section class="tab" id="tab-results"><h1>Previous results</h1><div class="panel tw" id="done"></div></section>
  <section class="tab" id="tab-progress"><h1>Performance</h1>
    <div class="charts">
      <div class="panel"><b>Subject-wise average (%)</b><canvas id="c1"></canvas></div>
      <div class="panel"><b>Marks in each quiz (%)</b><canvas id="c2"></canvas></div>
      <div class="panel"><b>Improvement over time (%)</b><canvas id="c3"></canvas></div></div>
    <p class="empty" id="noch" hidden>Charts appear after you complete your first quiz.</p>
  </section>
  <section class="tab" id="tab-notes"><h1>Notifications</h1><div class="panel" id="notes"></div></section>
</div>
<script src="config.js"></script><script src="app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
guard("student");
const $ = id => document.getElementById(id), charts = {};
const when = d => new Date(d).toLocaleString([], {dateStyle: "medium", timeStyle: "short"});
$("who").textContent = S.name; $("out").onclick = logout;
$("menu").onclick = () => $("sidebar").classList.toggle("open");
document.querySelectorAll("#sidebar nav button[data-tab]").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.id === "tab-" + b.dataset.tab));
  document.querySelectorAll("#sidebar nav button[data-tab]").forEach(x => x.classList.toggle("on", x === b));
  $("sidebar").classList.remove("open");
  if (b.dataset.tab === "notes") readNotes();
});
function chart(id, type, labels, data, extra = {}) {
  if (charts[id]) charts[id].destroy();
  charts[id] = new Chart($(id), {type, data: {labels, datasets: [{data, backgroundColor: "#800020", borderColor: "#800020", borderRadius: 6, tension: .3, ...extra}]},
    options: {plugins: {legend: {display: false}}, scales: {y: {beginAtZero: true, max: 100}}}});
}
async function load() {
  const d = await api("/student/dashboard/"), p = d.performance;
  $("hi").textContent = "Hello, " + d.student.name + "!";
  $("info").textContent = `Reg. no. ${d.student.reg_no} · Class ${d.student.class || "not assigned yet"}`;
  $("kpis").innerHTML = [["Completed quizzes", d.completed.length], ["Average score", p.average_percentage + "%"],
    ["Highest score", p.highest_percentage + "%"], ["Available now", d.available.length]]
    .map(([k, v]) => `<div class="kpi"><b>${v}</b>${k}</div>`).join("");
  $("avail").innerHTML = d.available.map(q => `<div class="qcard"><div><b>${esc(q.title)}</b><small>${esc(q.subject)} · ${q.duration_minutes} min · closes ${when(q.end_at)}</small></div>
    <a class="btn btn-primary sm" href="quiz.html?id=${q.id}">Start Quiz</a></div>`).join("") || `<p class="empty">No quizzes are open right now.</p>`;
  $("upc").innerHTML = d.upcoming.map(q => `<div class="qcard"><div><b>${esc(q.title)}</b><small>${esc(q.subject)} · ${q.duration_minutes} min</small></div>
    <span>Opens ${when(q.start_at)}</span></div>`).join("") || `<p class="empty">No upcoming quizzes.</p>`;
  $("done").innerHTML = d.completed.length ? `<table><tr><th>Quiz</th><th>Subject</th><th>Marks</th><th>%</th><th>Result</th><th>Correct</th><th>Wrong</th><th>Skipped</th></tr>` +
    d.completed.map(r => `<tr><td>${esc(r.title)}</td><td>${esc(r.subject)}</td><td>${r.obtained}/${r.total}</td><td>${r.percentage}%</td>
    <td><span class="badge ${r.passed ? "pass" : "fail"}">${r.passed ? "Pass" : "Fail"}</span></td><td>${r.correct}</td><td>${r.incorrect}</td><td>${r.unattempted}</td></tr>`).join("") + "</table>"
    : `<p class="empty">No results yet. Finished quizzes will show up here.</p>`;
  const has = p.quizzes.length > 0;
  $("noch").hidden = has; document.querySelectorAll("#tab-progress canvas").forEach(c => c.parentElement.hidden = !has);
  if (has) {
    chart("c1", "bar", p.subject_wise.map(x => x.subject), p.subject_wise.map(x => x.average));
    chart("c2", "bar", p.quizzes.map(q => q.quiz), p.quizzes.map(q => q.percentage));
    chart("c3", "line", p.quizzes.map(q => new Date(q.date).toLocaleDateString()), p.quizzes.map(q => q.percentage), {fill: false, pointRadius: 5});
  }
}
async function notes() {
  const n = await api("/notifications/"), unread = n.filter(x => !x.read).length;
  $("dot").hidden = !unread; $("dot").textContent = unread;
  $("notes").innerHTML = n.map(x => `<div class="note ${x.read ? "" : "new"}">${esc(x.message)}<small style="display:block;color:#777;font-weight:400">${when(x.created_at)}</small></div>`).join("") || `<p class="empty">No notifications.</p>`;
}
async function readNotes() { await notes(); try { await api("/notifications/", {method: "POST"}); $("dot").hidden = true; } catch (e) {} }
(async () => { await loadSchool(); try { await Promise.all([load(), notes()]); } catch (e) { toast(e.message, "err"); } })();
</script></body></html>
