<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login</title><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
body{min-height:100vh;display:grid;place-items:center;background:var(--panel);padding:20px}
.box{background:#fff;width:100%;max-width:420px;border-radius:18px;padding:30px;box-shadow:0 10px 30px rgba(0,0,0,.1)}
.box h1{margin:0 0 4px;color:var(--primary);font-size:1.6rem}
.tabs{display:flex;gap:6px;margin:18px 0}.tabs button{flex:1;padding:10px;border:2px solid #e3e5e8;background:#fff;border-radius:10px;font:inherit;font-weight:700;cursor:pointer}
.tabs button.on{border-color:var(--primary);background:var(--primary);color:#fff}
label{display:block;font-weight:700;margin:14px 0 6px}input{width:100%;padding:12px;border:2px solid #d9dce0;border-radius:10px;font:inherit}
input:focus{outline:none;border-color:var(--primary)}
.msg{margin-top:14px;padding:10px 12px;border-radius:10px;display:none}.msg.err{display:block;background:#fdecee;color:var(--red)}.msg.ok{display:block;background:#e8f5ee;color:var(--green)}
.btn{width:100%;margin-top:20px}.back{display:block;text-align:center;margin-top:16px;color:var(--primary);font-weight:700}
</style></head><body>
<form class="box" id="f" novalidate>
  <h1 id="title">Login</h1><div style="color:#666">Choose how you sign in</div>
  <div class="tabs" id="tabs"><button type="button" data-r="student" class="on">Student</button><button type="button" data-r="teacher">Teacher</button><button type="button" data-r="admin">Admin</button></div>
  <label for="id" id="idl">Registration number</label><input id="id" autocomplete="username">
  <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">
  <div class="msg" id="msg" role="alert"></div>
  <button class="btn btn-primary" id="go">Login</button>
  <a class="back" href="index.html">Back to home</a>
</form>
<script src="config.js"></script>
<script>
const DASH={student:"student-dashboard.html",teacher:"teacher-dashboard.html",admin:"admin-dashboard.html"};
const LABEL={student:"Registration number",teacher:"Registered email",admin:"Email"};
let role="student";const $=i=>document.getElementById(i);
$("tabs").onclick=e=>{const b=e.target.closest("button");if(!b)return;role=b.dataset.r;
  [...$("tabs").children].forEach(x=>x.classList.toggle("on",x===b));$("idl").textContent=LABEL[role];$("id").type=role==="student"?"text":"email";$("msg").className="msg";};
function show(t,c){$("msg").textContent=t;$("msg").className="msg "+c;}
$("f").onsubmit=async e=>{e.preventDefault();
  const identifier=$("id").value.trim(),password=$("pw").value;
  if(!identifier||!password)return show("Enter your "+LABEL[role].toLowerCase()+" and password.","err");
  $("go").disabled=true;
  try{
    const r=await fetch(API_BASE+"/auth/login/",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({role,identifier,password})});
    const d=await r.json();if(!r.ok)throw new Error(d.detail||"Login failed");
    sessionStorage.setItem("token",d.token);sessionStorage.setItem("role",d.role);sessionStorage.setItem("name",d.name);
    show("Welcome, "+d.name+"!","ok");
    fetch(DASH[role],{method:"HEAD"}).then(x=>{if(x.ok)location.href=DASH[role];else show("Logged in as "+d.name+" ("+role+"). Your dashboard page isn't built yet.","ok");}).catch(()=>{});
  }catch(err){show(err.message==="Failed to fetch"?"Can't reach the server. Is the backend running?":err.message,"err");}
  $("go").disabled=false;};
</script></body></html>
